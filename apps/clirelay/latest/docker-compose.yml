services:
  clirelay:
    image: ghcr.io/kittors/clirelay:latest
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    expose:
      - "8317"
    environment:
      TZ: Asia/Shanghai
      CLIRELAY_LOCALE: zh
      LANG: C.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: C.UTF-8
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
      - ./data:/CLIProxyAPI/data
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O- http://127.0.0.1:8317/ >/dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
