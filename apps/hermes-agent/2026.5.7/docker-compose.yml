services:
  hermes-agent:
    image: nousresearch/hermes-agent:v2026.5.7
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      1panel-network:
        aliases:
          - hermes-agent
    expose:
      - "8642"
    volumes:
      - ./data:/opt/data
    command:
      - gateway
      - run
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:8642/health >/dev/null || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
