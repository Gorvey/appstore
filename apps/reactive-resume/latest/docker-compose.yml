services:
  postgres:
    image: postgres:latest
    container_name: "${CONTAINER_NAME}-postgres"
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - 1panel-network
    volumes:
      - ./postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      createdBy: Apps
  printer:
    image: ghcr.io/browserless/chromium:latest
    container_name: "${CONTAINER_NAME}-printer"
    restart: unless-stopped
    env_file:
      - ./.env
    expose:
      - "3000"
    networks:
      - 1panel-network
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS \"http://localhost:3000/pressure?token=$$TOKEN\" >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      createdBy: Apps
  reactive-resume:
    image: amruthpillai/reactive-resume:latest
    container_name: "${CONTAINER_NAME}"
    restart: unless-stopped
    env_file:
      - ./.env
    expose:
      - "3000"
    networks:
      - 1panel-network
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      printer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:3000/api/health
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
