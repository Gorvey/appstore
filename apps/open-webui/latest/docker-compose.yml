services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.2
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    expose:
      - "8080"
    environment:
      OPENAI_API_BASE_URL: "${OPENAI_API_BASE_URL}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      ENABLE_OLLAMA_API: "false"
    volumes:
      - ./data:/app/backend/data
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
